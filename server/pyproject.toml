[project]
name = "blog-server"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlmodel>=0.0.21",
  "bcrypt>=4.0", "python-jose[cryptography]>=3.3",
  "python-frontmatter>=1.1", "Markdown>=3.6", "pymdown-extensions>=10.0",
  "nh3>=0.2", "beautifulsoup4>=4.12", "python-multipart>=0.0.9",
  "feedgen>=1.0", "email-validator>=2.0",
]
[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.setuptools]
packages = ["app", "app.routers"]
